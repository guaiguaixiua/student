<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>动漫网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff;
        }

        header {
            height:90px;
            position: relative;
            overflow:hidden;
        }
        .nav-bg-anime{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
           
            background-image: url("img/anime-eye.jpg");
            background-size: 140% auto;
            background-position:center;
            filter: brightness(0.45);
            animation: navBgMove 8s linear infinite alternate;
        }
        @keyframes navBgMove {
            0%{
                background-position: 0% 40%;
                transform: scale(1);
            }
            100%{
                background-position: 100% 60%;
                transform: scale(1.06);
            }
        }
        .nav-wrap{
            position:relative;
            z-index:2;
            max-width:1400px;
            margin:0 auto;
            height:90px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00adb5;
        }
        .nav-list {
            display: flex;
            gap: 32px;
            list-style: none;
        }
        .nav-list li a {
            color: #eee;
            text-decoration: none;
        }
        .nav-list li a:hover {
            color: #00adb5;
        }
        .search-input {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            outline: none;
        }

        .container{
            max-width:1400px;
            margin:20px auto;
            display:flex;
            gap:20px;
            padding:0 20px;
        }
        .sidebar{
            width:180px;
            background:#fff;
            padding:20px;
            box-shadow:0 0 8px #eee;
            border-radius:6px;
        }
        .sidebar h3{
            margin-bottom:12px;
            padding-bottom:6px;
            border-bottom:2px solid #00adb5;
        }
        .sidebar ul{
            list-style:none;
        }
        .sidebar li{
            line-height:2.2;
        }
        .sidebar li a{
            color:#333;
            text-decoration:none;
        }
        .sidebar li a:hover{
            color:#00adb5;
        }
        .main{
            flex:1;
        }
        .banner{
            width:100%;
            height:320px;
            background:#383e48;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:20px;
            margin-bottom:30px;
        }
        .title-line{
            font-size:22px;
            border-left:4px solid #00adb5;
            padding-left:10px;
            margin-bottom:20px;
        }
        .card-wrap{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:20px;
        }
        .card{
            box-shadow:0 0 6px #eee;
            border-radius:6px;
            overflow:hidden;
        }
        .card-img{
            height:240px;
            background:#ccc;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .card-text{
            padding:10px;
        }
        .card-name{
            font-weight:bold;
        }
        .card-desc{
            font-size:12px;
            color:#666;
            margin-top:4px;
        }
        footer{
            margin-top:40px;
            background:#222831;
            color:#aaa;
            text-align:center;
            padding:20px;
            font-size:14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-bg-anime"></div>
        <div class="nav-wrap">
            <div class="logo">动漫网站</div>
            <ul class="nav-list">
                <li><a href="#">首页</a></li>
                <li><a href="#">新番</a></li>
                <li><a href="#">完结番</a></li>
                <li><a href="#">动漫资讯</a></li>
                <li><a href="#">排行榜</a></li>
            </ul>
            <input class="search-input" placeholder="搜索动漫名称">
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>动漫分类</h3>
            <ul>
                <li><a href="#">全部</a></li>
                <li><a href="#">热血</a></li>
                <li><a href="#">校园</a></li>
                <li><a href="#">奇幻</a></li>
                <li><a href="#">治愈</a></li>
                <li><a href="#">悬疑</a></li>
                <li><a href="#">科幻</a></li>
            </ul>
        </aside>
        <main class="main">
            <div class="banner">轮播Banner区域（可后续接入JS轮播）</div>
            <h2 class="title-line">热门新番</h2>
            <div class="card-wrap">
                <div class="card">
                    <div class="card-img">封面图</div>
                    <div class="card-text">
                        <div class="card-name">动漫名称1</div>
                        <div class="card-desc">更新至第12话 | 奇幻</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-img">封面图</div>
                    <div class="card-text">
                        <div class="card-name">动漫名称2</div>
                        <div class="card-desc">更新至第08话 | 热血</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-img">封面图</div>
                    <div class="card-text">
                        <div class="card-name">动漫名称3</div>
                        <div class="card-desc">更新至第05话 | 治愈</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-img">封面图</div>
                    <div class="card-text">
                        <div class="card-name">动漫名称4</div>
                        <div class="card-desc">更新至第10话 | 校园</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        动漫网站 © 2026 版权归milk.li所有
    </footer>
</body>
</html>
